# CI do app Android (Plano e Projeto de Teste, 3.2): testes unitários (JUnit) e de captura de
# telas (Robolectric + Roborazzi) na JVM, sem emulador, e o build do APK de debug.
name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # gradlew foi versionado no Windows sem o bit de execução.
      - run: chmod +x gradlew
      - name: Testes (JUnit + Robolectric/Roborazzi)
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Build do APK de debug
        run: ./gradlew assembleDebug --console=plain
      - name: Capturas de tela e relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            app/build/outputs/roborazzi
            app/build/reports/tests
          retention-days: 7
